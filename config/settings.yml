# CNKD 一证通行登录插件配置
#
# 所有设置以 cnkd_login_ 开头，这样 /admin/plugins 的「设置」按钮能正确跳转。
cnkd_login:
  # ---- 总开关 ----
  cnkd_login_enabled:
    default: false
    client: true

  # ---- 应用凭据（由 CNKD 平台在审核通过后分配） ----
  cnkd_login_client_id:
    default: ""
    client: true

  # public 应用不填；confidential 应用仅保存在服务端（secret: true 使其不回传前端）
  cnkd_login_client_secret:
    default: ""
    secret: true

  cnkd_login_client_type:
    default: "confidential"
    type: enum
    choices:
      - public
      - confidential
    client: true

  # public 应用强制 S256 PKCE；confidential 应用建议一并开启
  cnkd_login_enable_pkce:
    default: true

  # ---- 平台地址（私有化部署或联调环境时修改） ----
  cnkd_login_site_url:
    default: "https://cloud.cnkd.fun"
    client: true

  # ---- 界面 ----
  cnkd_login_button_title:
    default: "CNKD 一证通行"
    client: true

  # ---- 授权的 scope ----
  # 基础资料与账号状态对所有合作方开放（文档 6.2），默认始终申请。
  #
  # 以下两项属敏感范围，仅 ownerType=cnkd_internal 且 trustedLevel>=4 的
  # CNKD 自有应用可申请；外部合作方开启会导致授权被平台拒绝。
  cnkd_login_request_email_verified:
    default: false

  # 申请 email.address 范围：让 /userinfo 直接返回邮箱明文，
  # 用户在本站注册时邮箱自动带入，不必手工填写。
  #
  # ⚠️ 与上面两项不同，这不属于「外部合作方一律不可申请」的范围：
  # 只要 CNKD 已为你的应用开通该范围，开启后登录即可自动带回邮箱。
  # 若应用未被授权，平台会在授权环节返回
  # 「当前应用未开放这些授权范围」，此时请关闭本开关。
  cnkd_login_scope_email:
    default: false

  # 把 CNKD 返回的已验证邮箱标记为「可信」，交给 Discourse 处理建号。
  #
  # 它落到 Auth::Result#email_valid 上，效果有三层：
  #   1. 注册页的邮箱输入框会以已验证状态**预填并锁定**，
  #      用户不必再手工输入（核心目标）；
  #   2. 账号创建后直接激活，不再发验证邮件；
  #   3. 提交的邮箱必须与 CNKD 返回的一致，否则建号被拒（防篡改）。
  #
  # 关闭后，即使拿到了邮箱也只会是普通文本，Discourse 仍要求用户
  # 在注册页自己填写并验证 —— 排查「为什么还要填邮箱」时先看这里。
  #
  # ⚠️ 已知副作用（非本开关引入，而是 always_update_user_email? = true 所致）：
  #    老账号登录时核心会执行 `user.save! if apply_user_attributes!`，
  #    把 CNKD 邮箱写回本地。若该邮箱已属于另一个本地账号，会撞 users 表
  #    唯一性校验并报「Primary email 已被采用」。插件已用
  #    Authenticator#email_owner_conflict 前置拦截，改为可读文案
  #    （login.cnkd.errors.email_already_taken）。详见 README 7.4.1。
  cnkd_login_auto_fill_email:
    default: false

  cnkd_login_request_qq_summary:
    default: false

  # ---- 安全 / 运维 ----
  # 记录平台错误详情与 requestId（不含任何令牌原文），便于对 CNKD 报障
  cnkd_login_verbose_logging:
    default: true

  # 邮箱未验证时是否拒绝登录。CNKD 侧门禁已强制验证，
  # 此开关作为本地二次防御，仅在能拿到 email 原文时生效。
  cnkd_login_require_verified_email:
    default: false
