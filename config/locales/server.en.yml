en:
  site_settings:
    cnkd_login_enabled: "Enable login with CNKD OnePass. When disabled, the CNKD button is hidden from the login page."
    cnkd_login_client_id: "The client_id assigned by CNKD (looks like cnkd_xxxxxxxx)."
    cnkd_login_client_secret: "Server-side secret for confidential apps. Never expose it. Leave blank for public apps."
    cnkd_login_client_type: "Application type. public apps are forced to S256 PKCE and carry no secret; confidential apps require a secret."
    cnkd_login_enable_pkce: "Enable PKCE (S256). Mandatory and cannot be disabled for public apps."
    cnkd_login_site_url: "CNKD site root. Production is https://cloud.cnkd.fun; change it for private deployments or staging."
    cnkd_login_button_title: "Label shown on the login button."
    cnkd_login_scope_email: "Request the email.address scope so CNKD returns the email address itself, sparing users from typing it at sign-up. CNKD must enable this scope for your application (once enabled it works for any owner type). Turning it on without the scope being granted makes authorisation fail, so leave it off until confirmed."
    cnkd_login_auto_fill_email: "Mark the verified email returned by CNKD as trusted, so Discourse pre-fills and locks the email field on the sign-up form instead of asking the user to type it. It also activates the new account straight away and rejects any posted email that does not match CNKD's."
    cnkd_login_request_email_verified: "Request the email.verified scope (boolean only, never the address). CNKD-internal apps only; rejected for partner apps."
    cnkd_login_request_qq_summary: "Request the qq.summary scope (QQ binding status, nickname, avatar). CNKD-internal apps only; rejected for partner apps."
    cnkd_login_verbose_logging: "Log CNKD error details and requestId for support. Never logs token material."
    cnkd_login_require_verified_email: "Require a verified email. When enabled, the emailVerified field from CNKD is checked strictly and the email.address scope is requested automatically (otherwise the setting can never take effect)."

  login:
    cnkd:
      title: "Log in with CNKD OnePass"
      name: "CNKD OnePass"
      errors:
        unknown: "CNKD login could not be completed. Please try again later."
        token_missing: "No CNKD access token was returned. Please start the login again."
        token_invalid: "Your CNKD session has expired. Please log in again."
        sub_missing: "CNKD did not return a user identifier, so the account cannot be linked. Please contact an administrator."
        account_inactive: "Your CNKD account cannot be used to log in right now. Please contact CNKD support."
        account_risk_blocked: "Your CNKD account is under a risk restriction and cannot log in at this time."
        email_not_verified: "Please verify your email address on CNKD before logging in."
        not_operator: "Your CNKD account is not authorised to use this application."
        consent_revoked: "You have revoked this site's CNKD authorisation. Please authorise it again to log in."
        consent_scope_changed: "You changed the CNKD scopes granted to this site. Please authorise again to log in."
        code_used: "This login credential has already been used. Please start the login again."
        code_expired: "This login timed out (authorisation codes are valid for 5 minutes). Please start again."
        code_missing: "CNKD did not return an authorisation code. Please start the login again."
        code_wrong_client: "The login credential does not belong to this site. Please start the login again."
        cnkd_session_missing: "Please sign in to CNKD first, then continue on this site."
        pkce_failed: "PKCE verification failed. Please start the login again."
        pkce_required: "This site's OAuth configuration is missing PKCE parameters. Please contact an administrator."
        pkce_method_unsupported: "The PKCE challenge method is not supported. Please contact an administrator."
        rate_limited: "Too many CNKD login attempts. Please try again shortly."
        app_unavailable: "The CNKD application is currently unavailable. Please ask an administrator to check its status."
        app_not_found: "The CNKD application does not exist. Please check the client_id setting."
        invalid_client_secret: "The CNKD client secret is invalid. Please check the configuration."
        public_app_no_secret: "Misconfigured application type: a public app must not have a secret."
        redirect_uri_mismatch: "The redirect URI does not match the value registered with CNKD. Please submit the callback URL to your CNKD contact for registration."
        scope_not_allowed: "The scopes requested by this site are not enabled for it on CNKD. Please contact an administrator."
        scope_unknown: "This site requested a scope CNKD does not support. Please contact an administrator."
        scope_missing: "No scope was requested. Please contact an administrator."
